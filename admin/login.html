<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — Dilli Web Studio</title>
    <link rel="stylesheet" href="css/admin-style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="glass-admin-card" style="width: min(92%, 420px); text-align: center; padding: 2.5rem 2rem;">
        <img src="../data/WebStudio-FinalLogo.png" alt="Dilli Web Studio Logo" class="brand-logo-img" style="margin-bottom: 1.5rem; height: 48px;" />
        <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 0.25rem;">Welcome Back</h2>
        <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1.75rem;">Enter your credentials to manage FirstStep Ahead.</p>
        
        <form onsubmit="event.preventDefault(); window.location.href='index.html';">
            <div class="admin-form-group" style="text-align: left;">
                <label for="adminEmail">Email or Username</label>
                <input type="text" id="adminEmail" class="admin-input" placeholder="admin@dilliwebstudio.com" required />
            </div>
            
            <div class="admin-form-group" style="text-align: left; position: relative;">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" class="admin-input" placeholder="••••••••" required />
                <i class="fa-solid fa-eye" id="togglePassword" style="position: absolute; right: 1rem; top: 2.3rem; cursor: pointer; color: var(--text-secondary);"></i>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem;">
                <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
                    <input type="checkbox" style="accent-color: var(--accent-blue);" /> Remember me
                </label>
                <a href="#" style="color: var(--accent-blue); text-decoration: none; font-weight: 600;">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn-pill-admin btn-primary-admin" style="width: 100%; justify-content: center; padding: 0.8rem;">Log In to Panel</button>
        </form>
    </div>
    <script src="js/admin-script.js"></script>
</body>
</html>
